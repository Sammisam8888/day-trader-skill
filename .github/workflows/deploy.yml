name: test and deploy

on:
  push:
    branches: [main]
    # A change that touches only workflows or offline research must not
    # redeploy (and restart the fill monitor) in the middle of a session.
    paths-ignore:
      - ".github/workflows/**"
      - "indstocks/research/**"
  pull_request:
  workflow_dispatch:

concurrency:
  # One deploy at a time. Two concurrent restarts of the token-holding
  # service would have both processes racing /generate/token, and each
  # call invalidates the other's token.
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run the offline suite
        run: |
          python3 -m pip install -q "cryptography>=41"   # web push (present on the box as python3-cryptography)
          python3 -m unittest discover -s tests

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Write deploy key and pinned host key
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Pinned, not StrictHostKeyChecking=no: without this the runner
          # trusts whatever answers on that IP.
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Pull and restart on the server
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -o BatchMode=yes "$USER@$HOST" bash -seu <<'REMOTE'
          cd /opt/indstocks/day-trader-skill
          git fetch --quiet origin main
          git reset --hard origin/main
          # Untracked leftovers survive reset --hard. Not `git clean -fdx`:
          # -x deletes ignored files too, which now includes trader/ -- the
          # live order history and positions.
          rm -rf .venv
          git clean -qfd
          # The venv lives OUTSIDE the work tree: anything created inside it
          # shows up in os.listdir(ROOT) and trips the root-layout test.
          VENV=/opt/indstocks/venv
          [ -d "$VENV" ] || python3 -m venv "$VENV"
          if [ -f requirements.txt ]; then "$VENV/bin/pip" install -q -r requirements.txt; fi
          python3 -m unittest discover -s tests
          # Broker change (INDstocks -> Shoonya): LIVE goes off ONCE, so a new
          # adapter never sends its first order without the owner saying so.
          if [ ! -f /var/lib/indstocks/.broker-shoonya ]; then
            sudo sed -i '/^TRADER_LIVE=/d' /etc/indstocks.env
            echo 'TRADER_LIVE=false' | sudo tee -a /etc/indstocks.env >/dev/null
            sudo mkdir -p /var/lib/indstocks && sudo touch /var/lib/indstocks/.broker-shoonya
          fi
          # Profile the owner chose on 2026-11-09: the AI decides, shorts and
          # re-entry on, 2x leverage, more symbols. Applied ONCE; later edits
          # on the dashboard or in chat are never overwritten.
          if [ ! -f /var/lib/indstocks/.profile-ai-aggressive-v1 ]; then
            for kv in TRADER_DECIDER=ai TRADER_ALLOW_SHORT=true TRADER_MAX_LEVERAGE=2.0 \
                      TRADER_MAX_CONCURRENT=3 TRADER_MAX_TRADES=8 TRADER_MAX_ENTRIES_PER_SYMBOL=2 \
                      TRADER_MAX_RESTING=6 TRADER_DAILY_LOSS=2500 TRADER_MAX_LOSS=600 \
                      TRADER_SYMBOLS=NIFTYBEES,BANKBEES,RELIANCE,HDFCBANK,ICICIBANK,SBIN,INFY,AXISBANK,BHARTIARTL,LT; do
              k=${kv%%=*}; sudo sed -i "/^$k=/d" /etc/indstocks.env; echo "$kv" | sudo tee -a /etc/indstocks.env >/dev/null
            done
            sudo touch /var/lib/indstocks/.profile-ai-aggressive-v1
          fi
          # Ceilings for the AI's set_risk_today raises (one time; edit the env
          # file to change, delete a line to forbid raising that limit).
          if [ ! -f /var/lib/indstocks/.profile-ceilings-v1 ]; then
            for kv in TRADER_CEIL_MAX_LOSS=900 TRADER_CEIL_MAX_TRADES=12 TRADER_CEIL_MAX_CONCURRENT=4 \
                      TRADER_CEIL_MAX_LEVERAGE=2.5; do
              k=${kv%%=*}; sudo sed -i "/^$k=/d" /etc/indstocks.env; echo "$kv" | sudo tee -a /etc/indstocks.env >/dev/null
            done
            sudo touch /var/lib/indstocks/.profile-ceilings-v1
          fi
          # Aggressive v3 (owner, 11 Nov 13:46): more trades, profit-funded extra trades.
          # Undoes the brief 2-slot / 4x-cost change.
          if [ ! -f /var/lib/indstocks/.profile-aggressive-v3 ]; then
            for kv in TRADER_STYLE=aggressive TRADER_MAX_CONCURRENT=4 TRADER_MIN_REWARD_TO_COST=2 \
                      TRADER_MAX_TRADES=10 TRADER_MAX_TRADES_HARD=20 TRADER_PROFIT_GIVEBACK_PCT=50 \
                      TRADER_MAX_ENTRIES_PER_SYMBOL=3 TRADER_MAX_RESTING=8 TRADER_LAST_ENTRY=14:45 \
                      TRADER_CEIL_MAX_TRADES=20 TRADER_CEIL_MAX_CONCURRENT=5; do
              k=${kv%%=*}; sudo sed -i "/^$k=/d" /etc/indstocks.env; echo "$kv" | sudo tee -a /etc/indstocks.env >/dev/null
            done
            sudo touch /var/lib/indstocks/.profile-aggressive-v3 /var/lib/indstocks/.profile-last-entry-v1
          fi
          # Aggressive v4 (owner, 11 Nov 14:59): hands-off, more leverage, bigger targets, more trades.
          if [ ! -f /var/lib/indstocks/.profile-aggressive-v4 ]; then
            for kv in TRADER_MAX_LEVERAGE=4.0 TRADER_CEIL_MAX_LEVERAGE=5.0 TRADER_MIN_RR=2.0 \
                      TRADER_MAX_TRADES=15 TRADER_MAX_TRADES_HARD=25 TRADER_CEIL_MAX_TRADES=25; do
              k=${kv%%=*}; sudo sed -i "/^$k=/d" /etc/indstocks.env; echo "$kv" | sudo tee -a /etc/indstocks.env >/dev/null
            done
            sudo touch /var/lib/indstocks/.profile-aggressive-v4
          fi
          # Bigger bets (owner, 11 Nov 15:09): no trade smaller than Rs 15k or netting under Rs 100 at target.
          if [ ! -f /var/lib/indstocks/.profile-bigger-bets-v1 ]; then
            for kv in TRADER_MIN_POSITION_VALUE=15000 TRADER_MIN_NET_TARGET=100; do
              k=${kv%%=*}; sudo sed -i "/^$k=/d" /etc/indstocks.env; echo "$kv" | sudo tee -a /etc/indstocks.env >/dev/null
            done
            sudo touch /var/lib/indstocks/.profile-bigger-bets-v1
          fi
          # V3 live + the flip layer (owner, 12 Nov 02:53): the back-tested V3 settings.
          if [ ! -f /var/lib/indstocks/.profile-v3-live ]; then
            for kv in TRADER_DIRECTION_GATE=enforce TRADER_USE_BOOK=false TRADER_SETUPS=orb,failed_break,day_break \
                      TRADER_TARGET_R=4 TRADER_NO_ENTRY_WINDOWS=12:00-13:00 TRADER_MAX_CONCURRENT=3 \
                      TRADER_MAX_LEVERAGE=5.0 TRADER_CEIL_MAX_LEVERAGE=5.0 TRADER_STOP_AFTER_LOSSES=3 \
                      TRADER_FLIP=true TRADER_FLIP_AFTER=3 TRADER_FLIP_HALT=2; do
              k=${kv%%=*}; sudo sed -i "/^$k=/d" /etc/indstocks.env; echo "$kv" | sudo tee -a /etc/indstocks.env >/dev/null
            done
            sudo touch /var/lib/indstocks/.profile-v3-live
          fi
          # Aggressive afternoon: entries until 14:30 (one time; edit the env file to change).
          # Owner, 17 Nov 13:21: resume trading today after the day lock tripped on the stale
          # morning peak during the 13:20 rollout; reset today's lock memory so the Rs 600 lock
          # guards new gains. One time (sentinel).
          if [ ! -f /var/lib/indstocks/.profile-resume-2026-11-17 ]; then
            f=/var/lib/indstocks/auto/lock/best-2026-11-17.json
            if [ -f "$f" ]; then
              sudo python3 -c "import json,sys; p=sys.argv[1]; d=json.load(open(p)); [d.pop(k, None) for k in ('_day', '_day_locked')]; json.dump(d, open(p, 'w'))" "$f"
            fi
            (cd /opt/indstocks/day-trader-skill/indstocks && sudo python3 -c "import control; print(control.apply({'command': 'resume_today', 'reason': 'owner: resume after the 13:20 rollout lock'}, by='owner'))") || true
            sudo touch /var/lib/indstocks/.profile-resume-2026-11-17
          fi
          # Owner, 17 Nov 18:51: stay LIVE (real orders); paper trading runs alongside, not instead.
          # Undoes the 18:50 paper switch once (sentinel).
          if [ ! -f /var/lib/indstocks/.profile-live-again-2026-11-17 ]; then
            sudo sed -i '/^TRADER_LIVE=/d' /etc/indstocks.env
            echo 'TRADER_LIVE=true' | sudo tee -a /etc/indstocks.env >/dev/null
            sudo touch /var/lib/indstocks/.profile-live-again-2026-11-17
          fi
          # Paper bench on more stocks (18 Nov): the tape also records these for the bench and
          # research; the AI does not trade them. One time (sentinel).
          if [ ! -f /var/lib/indstocks/.profile-tape-extra-v1 ]; then
            sudo sed -i '/^TRADER_TAPE_EXTRA=/d' /etc/indstocks.env
            echo 'TRADER_TAPE_EXTRA=TCS,KOTAKBANK,ITC,HINDUNILVR,BAJFINANCE,MARUTI,SUNPHARMA,TATASTEEL,TITAN,ULTRACEMCO,NTPC,POWERGRID,ONGC,ADANIENT,ADANIPORTS,WIPRO,HCLTECH,TECHM,JSWSTEEL,HINDALCO,COALINDIA,BEL,TRENT' | sudo tee -a /etc/indstocks.env >/dev/null
            sudo touch /var/lib/indstocks/.profile-tape-extra-v1
          fi
          # Owner, 19 Nov 11:27: the AI stood aside because a full-size slot (size floor 1.0)
          # cannot fit the loss room left today. Allow smaller entries (0.25-1.0 of a slot)
          # so it can trade inside the Rs 300 kill. One time (sentinel).
          if [ ! -f /var/lib/indstocks/.profile-size-floor-2026-11-19 ]; then
            sudo sed -i '/^TRADER_SIZE_FLOOR=/d' /etc/indstocks.env
            echo 'TRADER_SIZE_FLOOR=0.25' | sudo tee -a /etc/indstocks.env >/dev/null
            sudo touch /var/lib/indstocks/.profile-size-floor-2026-11-19
          fi
          # Owner, 19 Nov 10:00: undo the AI's 09:45 cut of max loss per trade (300 -> 80). One time.
          if [ ! -f /var/lib/indstocks/.profile-undo-risk-2026-11-19 ]; then
            (cd /opt/indstocks/day-trader-skill/indstocks && sudo python3 -c "import control; h = control.history('2026-11-19'); print([control.undo('2026-11-19', i) for i, x in enumerate(h) if x['command'] == 'set_risk_today' and x['by'] == 'ai' and x['outcome'] in ('applied', 'partly')])") || true
            sudo touch /var/lib/indstocks/.profile-undo-risk-2026-11-19
          fi
          # Trailing per-trade lock (owner, 19 Nov 07:44): arm at 0.5R, stop to breakeven, then
          # trail a rising share of the trade's best. One time (sentinel).
          if [ ! -f /var/lib/indstocks/.profile-trail-v1 ]; then
            for kv in TRADER_LOCK_ARM_R=0.5 TRADER_LOCK_ARM_RS=60 TRADER_LOCK_STEPS=0.5:40,1:60,2:75,3:85; do
              k=${kv%%=*}; sudo sed -i "/^$k=/d" /etc/indstocks.env; echo "$kv" | sudo tee -a /etc/indstocks.env >/dev/null
            done
            sudo touch /var/lib/indstocks/.profile-trail-v1
          fi
          # Owner, 19 Nov 16:59: funds withdrawn; paper only from 20 Nov (the PIP). The AI keeps
          # deciding and logging ("would_place"); nothing goes to the exchange. One time (sentinel).
          if [ ! -f /var/lib/indstocks/.profile-pip-paper-2026-11-20 ]; then
            sudo sed -i '/^TRADER_LIVE=/d' /etc/indstocks.env
            echo 'TRADER_LIVE=false' | sudo tee -a /etc/indstocks.env >/dev/null
            sudo touch /var/lib/indstocks/.profile-pip-paper-2026-11-20
          fi
          # Owner, 26 Nov: every strategy gets a Rs 1 lakh paper wallet and a Rs 1,000 day target, with no
          # daily loss limit, no loser stop, no flip and no day lock (only the target banks a day). Every
          # strategy journals its trades to /var/lib/indstocks/strategies/<strategy>/logs (data disk, never
          # overwritten by a deploy); the AI writes each strategy's learnings nightly. One time (sentinel).
          if [ ! -f /var/lib/indstocks/.profile-strategies-v1 ]; then
            sudo sed -i '/^TRADER_DAYLOCK_STEPS=/d' /etc/indstocks.env
            for kv in TRADER_STRATEGY_DIR=/var/lib/indstocks/strategies TRADER_BENCH_CAPITAL=100000 TRADER_PAPER_RISK=500 \
                      TRADER_BENCH_TARGET=1000 TRADER_PAPER_UNCAPPED=true TRADER_PAPER_CAPITAL=100000 TRADER_MAX_LOSS=1000 \
                      TRADER_STOP_AFTER_LOSSES=0 TRADER_FLIP=false TRADER_DAY_TARGET=1000 TRADER_DAYLOCK_ARM_RS=10000000; do
              k=${kv%%=*}; sudo sed -i "/^$k=/d" /etc/indstocks.env; echo "$kv" | sudo tee -a /etc/indstocks.env >/dev/null
            done
            sudo mkdir -p /var/lib/indstocks/strategies
            sudo touch /var/lib/indstocks/.profile-strategies-v1
          fi
          # 26 Nov: the 17 Nov safety net that turned STOP_AFTER_LOSSES 0 back into 3 is removed (the owner
          # wants no loser stop now); set 0 again once.
          if [ ! -f /var/lib/indstocks/.profile-no-loser-stop-v2 ]; then
            sudo sed -i '/^TRADER_STOP_AFTER_LOSSES=/d' /etc/indstocks.env
            echo 'TRADER_STOP_AFTER_LOSSES=0' | sudo tee -a /etc/indstocks.env >/dev/null
            sudo touch /var/lib/indstocks/.profile-no-loser-stop-v2
          fi
          # Company data (24 Nov): fill it once now so the AI and the Desk have it before the 16:30 run.
          if [ ! -f /var/lib/indstocks/.profile-company-first-run ]; then
            sudo systemctl start company.service || true
            sudo touch /var/lib/indstocks/.profile-company-first-run
          fi
          # Owner, 23 Nov 10:44: no daily loss stop during the paper PIP (each trade keeps its own
          # exchange stop). TRADER_DAILY_LOSS large = off; the fill monitor logs where Rs 300 would
          # have fired. Also drop M&M from the tape list: its "&" breaks shell sourcing. One time.
          if [ ! -f /var/lib/indstocks/.profile-no-daily-kill-2026-11-23 ]; then
            sudo sed -i '/^TRADER_DAILY_LOSS=/d' /etc/indstocks.env
            echo 'TRADER_DAILY_LOSS=100000' | sudo tee -a /etc/indstocks.env >/dev/null
            sudo sed -i 's/,M&M,/,/' /etc/indstocks.env
            sudo touch /var/lib/indstocks/.profile-no-daily-kill-2026-11-23
          fi
          # The PIP (owner, 19 Nov 17:05): the whole pipeline runs on the PAPER BROKER (real prices,
          # simulated fills, real charges); real orders refuse. TRADER_BROKER=paper goes in FIRST,
          # then the pipeline is switched on. One time (sentinel).
          if [ ! -f /var/lib/indstocks/.profile-pip-paperbroker-v1 ]; then
            sudo sed -i '/^TRADER_BROKER=/d' /etc/indstocks.env
            echo 'TRADER_BROKER=paper' | sudo tee -a /etc/indstocks.env >/dev/null
            for kv in TRADER_PAPER_CAPITAL=60000 TRADER_PIP_DAILY_MIN=400 TRADER_PIP_DAYS=14 TRADER_LIVE=true; do
              k=${kv%%=*}; sudo sed -i "/^$k=/d" /etc/indstocks.env; echo "$kv" | sudo tee -a /etc/indstocks.env >/dev/null
            done
            sudo touch /var/lib/indstocks/.profile-pip-paperbroker-v1
          fi
          # Ratchet day lock (owner, 17 Nov 14:25): the kept share of the day's best rises
          # as the day gets better, and +1000 net banks the day. Replaces the 600/60 step.
          if [ ! -f /var/lib/indstocks/.profile-ratchet-v1 ]; then
            for kv in TRADER_DAYLOCK_STEPS=150:40,300:55,600:65,1000:75,2000:80 TRADER_DAY_TARGET=1000; do
              k=${kv%%=*}; sudo sed -i "/^$k=/d" /etc/indstocks.env; echo "$kv" | sudo tee -a /etc/indstocks.env >/dev/null
            done
            sudo touch /var/lib/indstocks/.profile-ratchet-v1
          fi
          # Owner, 17 Nov 14:00: override the 3-loser stop for the rest of today only.
          # The Rs 300 daily kill still applies. A transient timer puts it back at 15:30.
          if [ ! -f /var/lib/indstocks/.profile-losers-override-2026-11-17 ]; then
            sudo sed -i "/^TRADER_STOP_AFTER_LOSSES=/d" /etc/indstocks.env
            echo "TRADER_STOP_AFTER_LOSSES=0" | sudo tee -a /etc/indstocks.env >/dev/null
            sudo systemd-run --unit=indstocks-losers-restore --on-calendar="2026-11-17 10:00:00 UTC" \
              /bin/sh -c 'sed -i "/^TRADER_STOP_AFTER_LOSSES=/d" /etc/indstocks.env; echo TRADER_STOP_AFTER_LOSSES=3 >> /etc/indstocks.env' || true
            sudo touch /var/lib/indstocks/.profile-losers-override-2026-11-17
          fi
          # Day lock at Rs 600, keep 60% (owner, 17 Nov 13:15: a +895 day ended -30 on stops).
          # Today's peak was already given back: clear today's day-best so the lock protects
          # new gains from now on instead of halting the day at once.
          if [ ! -f /var/lib/indstocks/.profile-daylock-600-v1 ]; then
            for kv in TRADER_DAYLOCK_ARM_RS=600 TRADER_DAYLOCK_KEEP_PCT=60; do
              k=${kv%%=*}; sudo sed -i "/^$k=/d" /etc/indstocks.env; echo "$kv" | sudo tee -a /etc/indstocks.env >/dev/null
            done
            f=/var/lib/indstocks/auto/lock/best-$(TZ=Asia/Kolkata date +%F).json
            if [ -f "$f" ]; then
              sudo python3 -c "import json,sys; p=sys.argv[1]; d=json.load(open(p)); d.pop('_day', None); d.pop('_day_locked', None); json.dump(d, open(p, 'w'))" "$f"
            fi
            sudo touch /var/lib/indstocks/.profile-daylock-600-v1
          fi
          # Kill at Rs 300 (owner, 16 Nov 19:49): the hard daily stop closes everything at
          # -300 net after charges; a trade may risk up to 300 (back-test: 300/300 made
          # +2,032 over 3 months at 60k; 300/200 only +61).
          if [ ! -f /var/lib/indstocks/.profile-kill-300-v1 ]; then
            for kv in TRADER_DAILY_LOSS=300 TRADER_MAX_LOSS=300; do
              k=${kv%%=*}; sudo sed -i "/^$k=/d" /etc/indstocks.env; echo "$kv" | sudo tee -a /etc/indstocks.env >/dev/null
            done
            sudo touch /var/lib/indstocks/.profile-kill-300-v1
          fi
          # Full size (owner, 16 Nov 09:54): use the 5x; every entry takes its full slot.
          if [ ! -f /var/lib/indstocks/.profile-full-size-v1 ]; then
            sudo sed -i "/^TRADER_SIZE_FLOOR=/d" /etc/indstocks.env
            echo "TRADER_SIZE_FLOOR=1.0" | sudo tee -a /etc/indstocks.env >/dev/null
            sudo touch /var/lib/indstocks/.profile-full-size-v1
          fi
          if [ ! -f /var/lib/indstocks/.profile-last-entry-v1 ]; then
            sudo sed -i "/^TRADER_LAST_ENTRY=/d" /etc/indstocks.env
            echo "TRADER_LAST_ENTRY=14:30" | sudo tee -a /etc/indstocks.env >/dev/null
            sudo touch /var/lib/indstocks/.profile-last-entry-v1
          fi
          # Units come from the repo on every deploy, so a schedule change in
          # git is a schedule change on the box. INDstocks-only units are
          # removed: that broker is no longer used.
          for u in indstocks-mcp.service shadow.timer shadow.service; do
            sudo systemctl disable --now "$u" >/dev/null 2>&1 || true
            sudo rm -f "/etc/systemd/system/$u"
          done
          for u in auto.service auto.timer flatten.service flatten.timer watch.service \
                   watch.timer fillmonitor.service dashboard.service login.service login.timer \
                   sentiment.service sentiment.timer ops.service ops.timer book.service book.timer newswatch.service \
                   learning.service learning.timer tape.service paper.service tuner.service tuner.timer company.service company.timer strategylearn.service strategylearn.timer; do
            sudo cp "scripts/$u" "/etc/systemd/system/$u"
          done
          sudo rm -rf /etc/systemd/system/auto.timer.d
          sudo systemctl daemon-reload
          sudo systemctl enable --now auto.timer flatten.timer watch.timer login.timer sentiment.timer ops.timer book.timer learning.timer tuner.timer company.timer strategylearn.timer >/dev/null
          if [ ! -f /var/lib/indstocks/.profile-company-first-run-v2 ]; then
            sudo timeout 200 systemctl start company.service || true
            sudo touch /var/lib/indstocks/.profile-company-first-run-v2
          fi
          for unit in dashboard fillmonitor newswatch tape paper; do
            sudo systemctl enable "$unit" >/dev/null
            sudo systemctl restart "$unit"
            sleep 2
            systemctl is-active --quiet "$unit" || { journalctl -u "$unit" -n 50 --no-pager; exit 1; }
          done
          # Private HTTPS for the dashboard on the tailnet only (tailscale serve, never funnel):
          # browsers allow notifications and service workers only over HTTPS.
          if sudo tailscale status --json | python3 -c "import json,sys; sys.exit(0 if json.load(sys.stdin).get('CertDomains') else 1)"; then
            sudo timeout 60 tailscale serve --bg --https=443 http://127.0.0.1:8080 >/dev/null 2>&1 \
              && echo "dashboard: https://$(sudo tailscale status --json | python3 -c "import json,sys; print(json.load(sys.stdin)['Self']['DNSName'].rstrip('.'))")/" \
              || echo "tailscale serve failed (dashboard stays on http)"
          else
            echo "Tailscale HTTPS certificates are off for this tailnet: enable them (admin console, DNS page) and redeploy"
          fi
          REMOTE
