name: test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # One deploy at a time. Two concurrent restarts of the token-holding
  # service would have both processes racing /generate/token, and each
  # call invalidates the other's token.
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run the offline suite
        run: python3 -m unittest discover -s tests

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Write deploy key and pinned host key
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Pinned, not StrictHostKeyChecking=no: without this the runner
          # trusts whatever answers on that IP.
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Pull and restart on the server
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -o BatchMode=yes "$USER@$HOST" bash -seu <<'REMOTE'
          cd /opt/indstocks/day-trader-skill
          git fetch --quiet origin main
          git reset --hard origin/main
          # Untracked leftovers survive reset --hard. Not `git clean -fdx`:
          # -x deletes ignored files too, which now includes trader/ -- the
          # live order history and positions.
          rm -rf .venv
          git clean -qfd
          # The venv lives OUTSIDE the work tree: anything created inside it
          # shows up in os.listdir(ROOT) and trips the root-layout test.
          VENV=/opt/indstocks/venv
          [ -d "$VENV" ] || python3 -m venv "$VENV"
          if [ -f requirements.txt ]; then "$VENV/bin/pip" install -q -r requirements.txt; fi
          python3 -m unittest discover -s tests
          # Broker change (INDstocks -> Shoonya): LIVE goes off ONCE, so a new
          # adapter never sends its first order without the owner saying so.
          if [ ! -f /var/lib/indstocks/.broker-shoonya ]; then
            sudo sed -i '/^TRADER_LIVE=/d' /etc/indstocks.env
            echo 'TRADER_LIVE=false' | sudo tee -a /etc/indstocks.env >/dev/null
            sudo mkdir -p /var/lib/indstocks && sudo touch /var/lib/indstocks/.broker-shoonya
          fi
          # Units come from the repo on every deploy, so a schedule change in
          # git is a schedule change on the box. INDstocks-only units are
          # removed: that broker is no longer used.
          for u in indstocks-mcp.service shadow.timer shadow.service; do
            sudo systemctl disable --now "$u" >/dev/null 2>&1 || true
            sudo rm -f "/etc/systemd/system/$u"
          done
          for u in auto.service auto.timer flatten.service flatten.timer watch.service \
                   watch.timer fillmonitor.service dashboard.service login.service login.timer; do
            sudo cp "scripts/$u" "/etc/systemd/system/$u"
          done
          sudo rm -rf /etc/systemd/system/auto.timer.d
          sudo systemctl daemon-reload
          sudo systemctl enable --now auto.timer flatten.timer watch.timer login.timer >/dev/null
          for unit in dashboard fillmonitor; do
            sudo systemctl enable "$unit" >/dev/null
            sudo systemctl restart "$unit"
            sleep 2
            systemctl is-active --quiet "$unit" || { journalctl -u "$unit" -n 50 --no-pager; exit 1; }
          done
          REMOTE
