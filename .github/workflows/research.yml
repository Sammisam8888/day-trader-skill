name: research

# Read-only research on the box, run by hand from the Actions tab:
# a fresh sentiment snapshot (what the trader will see), which outside
# sources the box can reach, and the both-sides / direction-gate backtest.
# Fixed commands only. Places nothing.

on:
  workflow_dispatch:
    inputs:
      days:
        description: "backtest sessions"
        default: "40"

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - name: Write deploy key and pinned host key
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Run
        env:
          DAYS: ${{ github.event.inputs.days }}
        run: |
          case "$DAYS" in ''|*[!0-9]*) DAYS=40;; esac
          ssh -o BatchMode=yes "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" bash -s -- "$DAYS" <<'REMOTE'
          set +e
          DAYS="$1"
          R=/opt/indstocks/day-trader-skill
          echo "== reachability from the box"
          for u in https://www.nseindia.com/ https://economictimes.indiatimes.com/markets/rssfeeds/1977021501.cms \
                   https://www.moneycontrol.com/rss/marketreports.xml https://www.livemint.com/rss/markets; do
            printf '%-70s ' "$u"; curl -s -o /dev/null -m 12 -A "Mozilla/5.0" -w "%{http_code}\n" "$u"
          done
          echo "== sentiment snapshot"
          cd $R/indstocks && sudo bash -c "set -a; . /etc/indstocks.env; set +a; timeout 280 python3 sentiment.py --force --news --print" 2>&1 | tail -120
          echo "== ops review (NSE calendar sync + Claude's verdict, with web search)"
          cd $R/indstocks && sudo bash -c "set -a; . /etc/indstocks.env; set +a; timeout 400 python3 ops.py" 2>&1 | tail -40
          echo "== calendar file"; sudo python3 -c "import json; d=json.load(open('/var/lib/indstocks/auto/control/calendar.json')); print(json.dumps({k: d[k] for k in d if k != 'nse_holidays'}, indent=1)); print({y: v for y, v in d.get('nse_holidays', {}).items()})"
          echo "== playbook backtest: every setup, long and short ($DAYS sessions, Rs 26k per trade)"
          sudo timeout 1500 bash $R/scripts/backtest-setups.sh "$DAYS" 2>&1 | tail -25
          echo "== backtest: long only vs both sides vs both + direction gate ($DAYS sessions)"
          sudo timeout 900 bash $R/scripts/backtest-sides.sh "$DAYS" 2>&1 | tail -20
          REMOTE
