name: export-candles

# Read-only: export the trading list's 5-minute candles from the box as an
# artifact, for offline simulation. Market data only.

on:
  workflow_dispatch:
    inputs:
      days:
        description: "calendar days back"
        default: "100"

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Write deploy key and pinned host key
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Export
        env:
          DAYS: ${{ github.event.inputs.days }}
        run: |
          case "$DAYS" in ''|*[!0-9]*) DAYS=100;; esac
          ssh -o BatchMode=yes "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "sudo bash /opt/indstocks/day-trader-skill/scripts/export-candles.sh $DAYS" > candles.json.gz
          ls -la candles.json.gz
          gzip -t candles.json.gz
      - name: Publish to the sim-data branch
        run: |
          git init -q data && cd data
          git config user.name "export-bot" && git config user.email "export-bot@users.noreply.github.com"
          git checkout -q -b sim-data
          cp ../candles.json.gz .
          git add candles.json.gz && git commit -q -m "candles $(date -u +%F)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" sim-data
