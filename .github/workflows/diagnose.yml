name: diagnose

# Read-only look at the box: today's decision log, service and timer state.
# Run by hand from the Actions tab. Prints nothing secret: the log holds
# symbols, prices and reasons, never credentials.

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Write deploy key and pinned host key
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Dump state
        run: |
          ssh -o BatchMode=yes "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" bash -s <<'REMOTE'
          set +e
          echo "== services"; systemctl is-active auto.timer flatten.timer watch.timer login.timer sentiment.timer ops.timer fillmonitor dashboard newswatch
          echo "== timers"; systemctl list-timers --no-pager --no-legend auto.timer flatten.timer watch.timer login.timer sentiment.timer ops.timer book.timer learning.timer; echo "== calendar today"; cd /opt/indstocks/day-trader-skill/indstocks && sudo python3 -c "import session as s; x=s.session_for(s.now().replace(hour=10)); print(s.now().date(), 'TRADING' if x else 'CLOSED', x and (x.open.time(), x.last_entry.time(), x.flat_by.time()))"
          echo "== halt"; cat /etc/indstocks.halt 2>/dev/null || echo "(not halted)"
          echo "== env (TRADER_*)"; sudo grep '^TRADER_' /etc/indstocks.env
          echo "== claude cli"; sudo -u ubuntu -H bash -lc 'command -v claude; claude --version' 2>&1
          echo "== claude answers (as the trader calls it)"; sudo bash /opt/indstocks/day-trader-skill/scripts/cli-probe.sh 2>&1 | grep -v '^{"ts' | tail -4
          D=$(TZ=Asia/Kolkata date +%F)
          echo "== newswatch"; sudo journalctl -u newswatch -n 8 --no-pager | cut -c1-260
          echo "== feeds"; for u in https://www.moneycontrol.com/rss/latestnews.xml https://www.business-standard.com/rss/markets-106.rss https://www.livemint.com/rss/markets; do printf '%-60s ' "$u"; curl -s -o /dev/null -m 10 -A "Mozilla/5.0" -w "%{http_code}\n" "$u"; done
          echo "== news sources (read-only fetch)"; cd /opt/indstocks/day-trader-skill/indstocks && sudo bash -c 'set -a; . /etc/indstocks.env; set +a; timeout 120 python3 -c "
          from datetime import timedelta
          import common, newswatch, sentiment, session as s
          now = s.now(); since = now - timedelta(hours=24)
          r = newswatch.from_rss(lambda u: sentiment.fetch(u, timeout=10), since)
          n = newswatch.from_nse(sentiment.nse_json, common.symbols())
          print(\"rss items\", len(r), \"| NSE filings for our symbols\", len(n))
          for x in r[:3]: print(\"  \", x[\"source\"], \"|\", x[\"title\"][:110])
          print(\"keys:\", [k for k in (\"TRADER_MARKETAUX_KEY\", \"TRADER_FINNHUB_KEY\", \"TRADER_ALPHAVANTAGE_KEY\") if common.setting(k)])
          "' 2>&1 | tail -8; cd - >/dev/null
          echo "== audit today"; sudo bash /opt/indstocks/day-trader-skill/scripts/audit-day.sh 2>&1 | head -120
          echo "== audit yesterday"; sudo bash /opt/indstocks/day-trader-skill/scripts/audit-day.sh "$(TZ=Asia/Kolkata date -d yesterday +%F)" 2>&1 | head -120
          echo "== lessons"; sudo test -f /var/lib/indstocks/learning/lessons.json && sudo python3 -c "import json;d=json.load(open('/var/lib/indstocks/learning/lessons.json'));[print(k,v['status'],'+%d/-%d'%(v['support'],v['against']),v['rule'][:200]) for k,v in d.items()]" 2>&1 | head -30
          echo "== journal latest"; sudo bash -c 'f=$(ls -1t /var/lib/indstocks/learning/journal-*.json 2>/dev/null | head -1); [ -n "$f" ] && python3 -c "import json,sys;j=json.load(open(sys.argv[1]));print(j[\"day\"],j.get(\"summary\"));[print(\" \",r.get(\"verdict\"),\"|\",str(r.get(\"post_mortem\"))[:220]) for r in (j.get(\"reviews\") or [])]" "$f"' 2>&1 | head -30
          echo "== trades today"; sudo grep -hE '"event": "(placed|sold|covered|target_exit|stop_placed|entry_cancelled|flip_on|day_summary|order_failed|order_rejected|news_alert|price_shock|scan_kicked)"' /var/lib/indstocks/auto/$D.jsonl | cut -c1-260 | tail -60
          echo "== log $D (last 120)"; sudo tail -n 120 /var/lib/indstocks/auto/$D.jsonl | cut -c1-400
          echo "== web"; curl -s -o /dev/null -w "/ %{http_code} %{content_type}\n" http://127.0.0.1:8080/; curl -s http://127.0.0.1:8080/api/state | python3 -c "import json,sys; d=json.load(sys.stdin); print('api/state', d.get('error') or 'ok', d.get('status'), (d.get('session') or {}).get('phase'))"
          echo "== shoonya"; sudo bash /opt/indstocks/day-trader-skill/scripts/shoonya-check.sh 2>&1 | tail -20
          echo "== auto.service last run"; sudo journalctl -u auto.service -n 40 --no-pager | cut -c1-300
          echo "== fillmonitor"; sudo journalctl -u fillmonitor -n 15 --no-pager | cut -c1-300
          REMOTE
